name: release
run-name: release ${{ inputs.tag || github.ref_name }} (by @${{ github.actor }})

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Version tag (e.g. v0.1.5)."
                required: true
            desktop:
                description: "Build the desktop app even if apps/desktop's version is unchanged."
                type: boolean
                default: false

permissions:
    contents: write

jobs:
    # ─── Job 1: resolve tag, and decide whether the desktop app ships ─────────
    prepare:
        name: prepare
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.tag.outputs.tag }}
            ver: ${{ steps.tag.outputs.ver }}
            desktop: ${{ steps.desktop.outputs.build }}
        steps:
            # Full history + tags: the desktop gate below reads a file out of
            # the PREVIOUS release tag, which a shallow clone doesn't have.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag
              id: tag
              run: |
                  if [ -n "${{ github.event.inputs.tag }}" ]; then
                    tag="${{ github.event.inputs.tag }}"
                  else
                    tag="${GITHUB_REF##*/}"
                  fi
                  case "$tag" in v*) ;; *) tag="v$tag" ;; esac
                  v="${tag#v}"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "ver=$v"   >> "$GITHUB_OUTPUT"

            # The desktop app is versioned by hand in apps/desktop/package.json
            # and is NOT in the CLI's lockstep bump — most releases are CLI-only
            # and would otherwise repackage five identical ~170 MB Electron
            # bundles. So it ships only when that version actually moved since
            # the previous tag. Bump apps/desktop/package.json to ship it (or
            # run the workflow by hand with `desktop` checked).
            #
            # Every ambiguous case builds: no previous tag, no file at that tag,
            # an unreadable version. Shipping a redundant bundle costs runner
            # minutes; silently skipping one the release needed strands the
            # desktop on an old build.
            - name: Decide whether the desktop app ships
              id: desktop
              run: |
                  ver_of() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1; }
                  if [ "${{ github.event.inputs.desktop }}" = "true" ]; then
                    echo "forced by workflow input"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  tag="${{ steps.tag.outputs.tag }}"
                  prev="$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$tag" | head -1)"
                  cur="$(ver_of < apps/desktop/package.json)"
                  old="$(git show "$prev:apps/desktop/package.json" 2>/dev/null | ver_of)"
                  if [ -z "$prev" ] || [ -z "$cur" ] || [ -z "$old" ] || [ "$cur" != "$old" ]; then
                    echo "desktop ${old:-?} → ${cur:-?} (prev tag: ${prev:-none}) — building"
                    echo "build=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "desktop still $cur since $prev — skipping the desktop matrix"
                    echo "build=false" >> "$GITHUB_OUTPUT"
                  fi

    # ─── Job 2: per-platform binary build (matrix) ───────────────────────────
    # loop has no native NAPI modules anymore, so `bun build --compile
    # --target=…` cross-compiles every target from any host (Bun downloads the
    # prebuilt runtime for the target). Most targets still build on a runner
    # matching their OS+arch so the --version smoke test runs natively.
    # darwin-x64 is the exception: GitHub offers no free Intel-mac runner, so it
    # is cross-compiled on the Apple-Silicon macos-14 runner. It can't be run
    # there for the smoke test (Rosetta 2 SIGILLs on AVX/baseline alike), so its
    # binary is validated statically (Mach-O x86_64) instead of executed.
    build-binary:
        name: binary (${{ matrix.target }})
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: darwin-arm64
                      runner: macos-14
                    - target: darwin-x64
                      runner: macos-14 # arm64 host → cross-compiled, validated statically
                    - target: linux-x64
                      runner: ubuntu-latest
                    - target: linux-arm64
                      runner: ubuntu-24.04-arm
                    - target: windows-x64
                      runner: windows-latest
        runs-on: ${{ matrix.runner }}
        # Force bash on Windows runners too (default is pwsh). Git Bash ships
        # with windows-latest and provides sha256sum, tar, bun shell helpers.
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Sync package versions
              run: |
                  v="${{ needs.prepare.outputs.ver }}"
                  bun -e "
                    const fs = require('fs');
                    for (const p of ['packages/core/package.json','packages/tui/package.json','packages/cli/package.json','packages/web/package.json']) {
                      const j = JSON.parse(fs.readFileSync(p,'utf8'));
                      j.version = '$v';
                      fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
                    }
                  "

            - run: bun install --frozen-lockfile
            - run: bun run gen:catalog
            - run: bun packages/core/build.ts
            - run: bun packages/tui/build.ts
            # Retry the compile: fetching the cross-target Bun runtime is
            # occasionally flaky ("Failed to extract executable … download may
            # be incomplete"), especially for the -baseline variants. 3 attempts
            # with a backoff turns a transient download blip into a pass.
            - name: Build binary
              run: |
                  n=0
                  until bun packages/cli/build-bin.ts bun-${{ matrix.target }}; do
                    n=$((n + 1))
                    if [ "$n" -ge 3 ]; then echo "build failed after $n attempts"; exit 1; fi
                    echo "build attempt $n failed — retrying in 5s…"; sleep 5
                  done

            - name: Smoke test binary
              run: |
                  # bun --compile appends .exe on windows targets
                  bin="./packages/cli/dist/bin/${{ matrix.target }}/loop"
                  [ -f "${bin}.exe" ] && bin="${bin}.exe"
                  if [ "${{ matrix.target }}" = "darwin-x64" ]; then
                    # Cross-compiled on the arm64 runner — can't run it here:
                    # Rosetta 2 lacks AVX and SIGILLs even on the baseline build,
                    # so executing it is a false negative. Validate statically
                    # that it's a real, non-trivial x86_64 Mach-O instead.
                    file "$bin"
                    file "$bin" | grep -q "x86_64"
                    sz=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
                    test "$sz" -gt 10000000
                  else
                    "$bin" --version
                  fi

            - name: Compute sha256
              working-directory: packages/cli/dist/bin
              run: |
                  if command -v sha256sum >/dev/null; then
                    sha256sum "loop-${{ matrix.target }}.tar.gz" > "loop-${{ matrix.target }}.tar.gz.sha256"
                  else
                    shasum -a 256 "loop-${{ matrix.target }}.tar.gz" > "loop-${{ matrix.target }}.tar.gz.sha256"
                  fi
                  ls -lh

            - name: Upload binary artifact
              uses: actions/upload-artifact@v4
              with:
                  name: bin-${{ matrix.target }}
                  path: |
                      packages/cli/dist/bin/loop-${{ matrix.target }}.tar.gz
                      packages/cli/dist/bin/loop-${{ matrix.target }}.tar.gz.sha256
                  retention-days: 14

    # ─── Job 3: desktop app (matrix) ─────────────────────────────────────────
    # The Electron app, which unlike the CLI cannot be cross-built freely:
    # node-pty is a native addon and upstream publishes prebuilds for darwin and
    # win32 only. Linux has to compile it, so a linux package MUST be built on a
    # linux runner — hence a real matrix rather than one host fanning out.
    # darwin-x64 is the exception in the other direction: it has a prebuild, so
    # the arm64 mac runner can package it (GitHub offers no free Intel mac).
    #
    # Gated on the desktop's own version having moved — see the prepare job.
    build-desktop:
        name: desktop (${{ matrix.target }})
        needs: prepare
        if: needs.prepare.outputs.desktop == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: darwin-arm64
                      cli: bun-darwin-arm64
                      runner: macos-14
                    - target: darwin-x64
                      cli: bun-darwin-x64
                      runner: macos-14 # arm64 host → cross-packaged (prebuild exists)
                    - target: linux-x64
                      cli: bun-linux-x64
                      runner: ubuntu-latest
                    - target: linux-arm64
                      cli: bun-linux-arm64
                      runner: ubuntu-24.04-arm
                    - target: win32-x64
                      cli: bun-windows-x64
                      runner: windows-latest
        runs-on: ${{ matrix.runner }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Sync package versions
              run: |
                  v="${{ needs.prepare.outputs.ver }}"
                  bun -e "
                    const fs = require('fs');
                    for (const p of ['packages/core/package.json','packages/tui/package.json','packages/cli/package.json','packages/web/package.json']) {
                      const j = JSON.parse(fs.readFileSync(p,'utf8'));
                      j.version = '$v';
                      fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
                    }
                  "

            - run: bun install --frozen-lockfile
            - run: bun run gen:catalog
            - run: bun packages/core/build.ts
            - run: bun packages/tui/build.ts

            # The app spawns this, so it must be the TARGET's binary — the
            # packager copies it out of here by target name.
            - name: Build bundled loop binary
              run: bun packages/cli/build-bin.ts ${{ matrix.cli }}

            - name: Build renderer + desktop bundle
              run: |
                  bun run --filter @loop/web build
                  cd apps/desktop && bun build.ts

            - name: Package
              working-directory: apps/desktop
              env:
                  LOOP_VERSION: ${{ needs.prepare.outputs.ver }}
              run: bun package-app.ts ${{ matrix.target }}

            - name: Compute sha256
              working-directory: apps/desktop/release
              run: |
                  f=$(ls loop-desktop-${{ matrix.target }}.* | head -1)
                  if command -v sha256sum >/dev/null; then
                    sha256sum "$f" > "$f.sha256"
                  else
                    shasum -a 256 "$f" > "$f.sha256"
                  fi
                  ls -lh

            - name: Upload desktop artifact
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-${{ matrix.target }}
                  path: |
                      apps/desktop/release/loop-desktop-${{ matrix.target }}.zip
                      apps/desktop/release/loop-desktop-${{ matrix.target }}.tar.gz
                      apps/desktop/release/loop-desktop-${{ matrix.target }}.*.sha256
                  if-no-files-found: error
                  retention-days: 14

    # ─── Job 4: GitHub Release ────────────────────────────────────────────────
    release:
        name: github-release
        needs: [prepare, build-binary, build-desktop]
        # build-desktop is skipped on a CLI-only release, and a skipped `needs`
        # would otherwise skip this job with it. Anything actually FAILING still
        # stops the release.
        if: ${{ !failure() && !cancelled() }}
        runs-on: ubuntu-latest
        steps:
            - name: Download all binary artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: bin-*
                  path: release
                  merge-multiple: true

            - name: Download all desktop artifacts
              if: needs.prepare.outputs.desktop == 'true'
              uses: actions/download-artifact@v4
              with:
                  pattern: desktop-*
                  path: release
                  merge-multiple: true

            - name: Aggregate SHA256SUMS
              working-directory: release
              run: |
                  ls -lh
                  : > SHA256SUMS
                  # Desktop archives are .zip on mac/windows and .tar.gz on
                  # linux, so the glob is by prefix rather than extension —
                  # matching only *.tar.gz would silently omit three of the five.
                  for f in loop-*.tar.gz loop-desktop-*.zip; do
                    [ -e "$f" ] || continue
                    sha256sum "$f" >> SHA256SUMS
                  done
                  cat SHA256SUMS

            # The desktop globs match nothing on a CLI-only release; that is a
            # warning, not a failure (fail_on_unmatched_files defaults off), so
            # the release publishes with the binaries alone. The installers walk
            # back to the newest release that carries a desktop asset.
            - name: Create / update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.prepare.outputs.tag }}
                  name: ${{ needs.prepare.outputs.tag }}
                  generate_release_notes: true
                  files: |
                      release/loop-*.tar.gz
                      release/loop-*.tar.gz.sha256
                      release/loop-desktop-*.zip
                      release/loop-desktop-*.zip.sha256
                      release/SHA256SUMS

            # Float the major tag (v0.12.3 → v0) so `uses: notshekhar/loop@v0`
            # picks up every release without pinning.
            - name: Check out repo (for the major tag)
              uses: actions/checkout@v4

            - name: Float major tag
              run: |
                  tag="${{ needs.prepare.outputs.tag }}"
                  ver="${tag#v}"
                  major="v${ver%%.*}"
                  # Forced, because git refuses to move an existing tag ref and
                  # the checkout above may already hold this one — a tag-push
                  # run checks out the very tag being fetched here, so the
                  # unforced fetch dies with "would clobber existing tag" AFTER
                  # the release has already been published. The float is then
                  # silently a release behind, which is invisible until someone
                  # on `uses: notshekhar/loop@v0` reports running old code.
                  git fetch --force origin "refs/tags/$tag:refs/tags/$tag" --no-tags
                  git tag -f "$major" "refs/tags/$tag"
                  git push -f origin "refs/tags/$major"

    # ─── Job 4: bump the Homebrew tap ─────────────────────────────────────────
    # Regenerates notshekhar/homebrew-tap's Formula/loop.rb from the release's
    # SHA256SUMS so `brew install notshekhar/tap/loop` tracks every tag with no
    # manual step. Needs a PAT (HOMEBREW_TAP_TOKEN) with write access to the tap
    # repo — the default GITHUB_TOKEN can't push to a different repository.
    update-homebrew-tap:
        name: update-homebrew-tap
        needs: [prepare, release]
        # Needed for the same reason as `release`, and needed SEPARATELY: a
        # skipped job propagates down the whole `needs` graph, not just one hop.
        # `release` overriding it for itself does not save this job — v0.18.8
        # published fine and left the tap a release behind, which is invisible
        # until someone's `brew upgrade` finds nothing.
        if: ${{ !failure() && !cancelled() }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out loop (for the render script)
              uses: actions/checkout@v4
              with:
                  path: loop

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Check out tap repo
              uses: actions/checkout@v4
              with:
                  repository: notshekhar/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: tap

            - name: Fetch checksums from release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release download "${{ needs.prepare.outputs.tag }}" \
                    --repo "${{ github.repository }}" \
                    --pattern SHA256SUMS --output SHA256SUMS --clobber

            - name: Render Formula/loop.rb
              run: |
                  mkdir -p tap/Formula
                  bun loop/.github/scripts/render-formula.ts \
                    "${{ needs.prepare.outputs.ver }}" \
                    SHA256SUMS \
                    tap/Formula/loop.rb

            - name: Commit & push
              working-directory: tap
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add Formula/loop.rb
                  if git diff --cached --quiet; then
                    echo "Formula already up to date — nothing to push."
                  else
                    git commit -m "loop ${{ needs.prepare.outputs.ver }}"
                    git push
                  fi
