name: mobile

# loop's phone app (apps/mobile): checks it, builds an installable Android APK,
# and publishes it to the rolling `mobile-latest` pre-release — one link that
# always holds the newest build, to open on a phone and install.
#
# The APK is signed with loop's upload key (repo secrets
# ANDROID_UPLOAD_KEYSTORE_BASE64 / ANDROID_UPLOAD_KEYSTORE_PASSWORD), so every
# build installs over the last. Without the secrets (a fork) it signs with a
# throwaway debug key and is uploaded as a run artifact only.
#
# iOS needs a paid Apple team to install outside the Simulator; it is not built
# here yet.

on:
    push:
        branches: [main]
        paths:
            - "apps/mobile/**"
            - "apps/web/src/loop/**"
            - "apps/web/src/components/loop/loopVerbGroup.ts"
            - "patches/**"
            - "package.json"
            - "bun.lock"
            - ".github/workflows/mobile.yml"
    pull_request:
        paths:
            - "apps/mobile/**"
            - "apps/web/src/loop/**"
            - ".github/workflows/mobile.yml"
    workflow_dispatch:
        inputs:
            variant:
                description: "release (installable, published from main) or dev (loop Dev: a debug dev client that loads JS from Metro)"
                type: choice
                options: [release, dev]
                default: release

permissions:
    contents: write

concurrency:
    group: mobile-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: bun install --frozen-lockfile
            - name: Typecheck the app
              working-directory: apps/mobile
              run: ./node_modules/.bin/tsc --noEmit -p .
            - name: Unit tests
              run: bun run --filter @loop/mobile test

    android:
        needs: check
        runs-on: ubuntu-latest
        # A cold Gradle + C++ build of the native modules is the long pole.
        timeout-minutes: 75
        env:
            # `dev` is for working on the app: a separate "loop Dev" install
            # that loads its JavaScript from Metro, so a change reloads in
            # seconds on a real Hermes instead of costing a 15-minute build.
            APP_VARIANT: ${{ inputs.variant == 'dev' && 'development' || 'production' }}
            GRADLE_TASK: ${{ inputs.variant == 'dev' && 'assembleDebug' || 'assembleRelease' }}
            APK_DIR: ${{ inputs.variant == 'dev' && 'debug/app-debug.apk' || 'release/app-release.apk' }}
            NAME_SUFFIX: ${{ inputs.variant == 'dev' && '-dev' || '' }}
            EXPO_NO_GIT_STATUS: "1"
            LOOP_ANDROID_VERSION_CODE: ${{ github.run_number }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            - uses: gradle/actions/setup-gradle@v4
            - run: bun install --frozen-lockfile

            - name: Generate the Android project
              working-directory: apps/mobile
              run: npx expo prebuild --platform android --no-install

            - name: Signing key
              id: key
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                    echo "No upload key (fork?) — signing with the debug key."
                    echo "signed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/loop-upload.p12"
                  # Gradle reads ORG_GRADLE_PROJECT_<name> as project property
                  # <name> — no edit to the generated gradle.properties (whose
                  # missing final newline glued an appended line onto the JVM
                  # args the first time round).
                  {
                    echo "ORG_GRADLE_PROJECT_loopUploadStoreFile=$RUNNER_TEMP/loop-upload.p12"
                    echo "ORG_GRADLE_PROJECT_loopUploadStorePassword=$KEYSTORE_PASSWORD"
                    echo "ORG_GRADLE_PROJECT_loopUploadKeyAlias=loop"
                    echo "ORG_GRADLE_PROJECT_loopUploadKeyPassword=$KEYSTORE_PASSWORD"
                  } >> "$GITHUB_ENV"
                  echo "signed=true" >> "$GITHUB_OUTPUT"

            - name: Build the APK (arm64 — every phone from the last decade)
              working-directory: apps/mobile/android
              run: ./gradlew $GRADLE_TASK -PreactNativeArchitectures=arm64-v8a --no-daemon

            - name: Name it
              id: apk
              run: |
                  version=$(node -p "require('./apps/mobile/package.json').version")
                  name="loop-android-${version}-${{ github.run_number }}${NAME_SUFFIX}.apk"
                  cp "apps/mobile/android/app/build/outputs/apk/$APK_DIR" "$name"
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  ls -la "$name"

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.apk.outputs.name }}
                  path: ${{ steps.apk.outputs.name }}
                  retention-days: 30

            # Only signed builds from main reach the release: a debug-signed
            # APK would not install over the last one anyway.
            - name: Publish to the mobile-latest pre-release
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.key.outputs.signed == 'true' && inputs.variant != 'dev'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  notes="Newest loop Android build (run ${{ github.run_number }}, ${GITHUB_SHA::7}).
                  Open this page on your phone, tap the .apk, and allow installing from your browser.
                  It is a remote control: pair it with \`loop serve\` (or \`/rc\`) on your computer."
                  git tag -f mobile-latest "$GITHUB_SHA"
                  git push -f origin mobile-latest
                  if gh release view mobile-latest >/dev/null 2>&1; then
                    gh release edit mobile-latest --prerelease --title "loop Android (latest)" --notes "$notes"
                    for asset in $(gh release view mobile-latest --json assets -q '.assets[].name'); do
                      gh release delete-asset mobile-latest "$asset" -y
                    done
                  else
                    gh release create mobile-latest --prerelease --title "loop Android (latest)" --notes "$notes"
                  fi
                  gh release upload mobile-latest "${{ steps.apk.outputs.name }}" --clobber
